{% extends "base.html" %}

{% block title %}Sign In — Reel Verifier{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="card auth-card">
        <div class="auth-header">
            <div class="auth-logo-badge" aria-hidden="true">🎬</div>
            <h1 class="auth-title">Reel<span class="logo-gradient-text">Verifier</span></h1>
            <p class="auth-subtitle">
                Enter your email address to access the verification workspace.
            </p>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input" 
                    placeholder="name@company.com" 
                    required 
                    autocomplete="email"
                    autofocus
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary submit-btn">
                    <span>Continue &rarr;</span>
                </button>
            </div>
        </form>

        <div class="auth-footer-note">
            <span>No password required &bull; 10 free checks daily</span>
        </div>
    </div>
</div>
{% endblock %}
